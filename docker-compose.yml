version: "3"
services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_provisioning.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json
    depends_on:
      - prometheus
